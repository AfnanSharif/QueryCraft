[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querycraft-text2sql"
version = "1.0.0"
description = "Safe offline-first natural-language analytics"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "python-dotenv>=1.0,<2"]

[project.scripts]
querycraft = "text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
